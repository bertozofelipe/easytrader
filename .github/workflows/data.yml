name: Dados de mercado

on:
  schedule:
    # A cada 15 minutos (o GitHub pode atrasar execuções agendadas em alguns minutos).
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Coletar dados
        run: node scripts/fetch-data.mjs --out .data-out
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}

      # Publica os JSON num branch órfão `data` com um único commit (sobrescrito a cada execução),
      # para não inflar o histórico nem disparar rebuild do site.
      - name: Publicar no branch data
        working-directory: .data-out
        env:
          TOKEN: ${{ github.token }}
        run: |
          git init -q -b data
          git config user.name "easytrader-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Dados de mercado $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
